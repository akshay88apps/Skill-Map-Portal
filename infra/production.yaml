AWSTemplateFormatVersion: '2010-09-09'
Description: Tech Leaders Skill Portal production stack (ECS Fargate, ALB, RDS PostgreSQL, SES permissions)
Parameters:
  ImageUri: { Type: String }
  CertificateArn: { Type: String, Description: ACM certificate in this region for the production hostname }
  DatabasePassword: { Type: String, NoEcho: true, MinLength: 16 }
  AuthSecret: { Type: String, NoEcho: true, MinLength: 32 }
  EntraClientId: { Type: String }
  EntraClientSecret: { Type: String, NoEcho: true }
  EntraIssuer: { Type: String }
  AdminGroupId: { Type: String }
  LeaderGroupId: { Type: String, Default: '' }
  AppBaseUrl: { Type: String }
  SesFromEmail: { Type: String }
  CronSecret: { Type: String, NoEcho: true, MinLength: 24 }
  DesiredCount: { Type: Number, Default: 2 }
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties: { CidrBlock: 10.42.0.0/16, EnableDnsHostnames: true, EnableDnsSupport: true, Tags: [{Key: Name, Value: skillmap-prod}] }
  InternetGateway: { Type: AWS::EC2::InternetGateway }
  GatewayAttachment: { Type: AWS::EC2::VPCGatewayAttachment, Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway } }
  PublicSubnetA: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.42.0.0/24, AvailabilityZone: !Select [0, !GetAZs ''], MapPublicIpOnLaunch: true } }
  PublicSubnetB: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.42.1.0/24, AvailabilityZone: !Select [1, !GetAZs ''], MapPublicIpOnLaunch: true } }
  PrivateSubnetA: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.42.10.0/24, AvailabilityZone: !Select [0, !GetAZs ''] } }
  PrivateSubnetB: { Type: AWS::EC2::Subnet, Properties: { VpcId: !Ref Vpc, CidrBlock: 10.42.11.0/24, AvailabilityZone: !Select [1, !GetAZs ''] } }
  PublicRouteTable: { Type: AWS::EC2::RouteTable, Properties: { VpcId: !Ref Vpc } }
  PublicRoute: { Type: AWS::EC2::Route, DependsOn: GatewayAttachment, Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway } }
  PublicAssocA: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable } }
  PublicAssocB: { Type: AWS::EC2::SubnetRouteTableAssociation, Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable } }
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties: { GroupDescription: HTTPS ingress, VpcId: !Ref Vpc, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}] }
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties: { GroupDescription: ALB to app, VpcId: !Ref Vpc, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSg}] }
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties: { GroupDescription: App to PostgreSQL, VpcId: !Ref Vpc, SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSg}] }
  DbSubnets: { Type: AWS::RDS::DBSubnetGroup, Properties: { DBSubnetGroupDescription: Skillmap private DB subnets, SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB] } }
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageEncrypted: true
      BackupRetentionPeriod: 14
      DeletionProtection: true
      MultiAZ: false
      PubliclyAccessible: false
      DBName: skillportal
      MasterUsername: portal
      MasterUserPassword: !Ref DatabasePassword
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
  Cluster: { Type: AWS::ECS::Cluster, Properties: { ClusterName: skillmap-production, ClusterSettings: [{Name: containerInsights, Value: enabled}] } }
  Logs: { Type: AWS::Logs::LogGroup, DeletionPolicy: Retain, Properties: { LogGroupName: /ecs/skillmap-production, RetentionInDays: 90 } }
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}] }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies: [{PolicyName: ReadAppSecrets, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref AppSecrets}]}}]
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: skillmap/production/application
      SecretString: !Sub '{"DATABASE_PASSWORD":"${DatabasePassword}","AUTH_SECRET":"${AuthSecret}","AUTH_MICROSOFT_ENTRA_ID_ID":"${EntraClientId}","AUTH_MICROSOFT_ENTRA_ID_SECRET":"${EntraClientSecret}","AUTH_MICROSOFT_ENTRA_ID_ISSUER":"${EntraIssuer}","AUTH_ADMIN_GROUP_ID":"${AdminGroupId}","AUTH_LEADER_GROUP_ID":"${LeaderGroupId}","CRON_SECRET":"${CronSecret}"}'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}] }
      Policies: [{PolicyName: SendInvitations, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: ['ses:SendEmail','ses:SendRawEmail'], Resource: '*'}]}}]
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: skillmap-production
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 3000}]
          HealthCheck: {Command: ['CMD-SHELL','wget -q -O - http://localhost:3000/api/health || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 60}
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: DATABASE_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: DATABASE_PORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: DATABASE_NAME, Value: skillportal}
            - {Name: DATABASE_USER, Value: portal}
            - {Name: AUTH_TRUST_HOST, Value: 'true'}
            - {Name: APP_BASE_URL, Value: !Ref AppBaseUrl}
            - {Name: SES_FROM_EMAIL, Value: !Ref SesFromEmail}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
          Secrets:
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${AppSecrets}:DATABASE_PASSWORD::'}
            - {Name: AUTH_SECRET, ValueFrom: !Sub '${AppSecrets}:AUTH_SECRET::'}
            - {Name: AUTH_MICROSOFT_ENTRA_ID_ID, ValueFrom: !Sub '${AppSecrets}:AUTH_MICROSOFT_ENTRA_ID_ID::'}
            - {Name: AUTH_MICROSOFT_ENTRA_ID_SECRET, ValueFrom: !Sub '${AppSecrets}:AUTH_MICROSOFT_ENTRA_ID_SECRET::'}
            - {Name: AUTH_MICROSOFT_ENTRA_ID_ISSUER, ValueFrom: !Sub '${AppSecrets}:AUTH_MICROSOFT_ENTRA_ID_ISSUER::'}
            - {Name: AUTH_ADMIN_GROUP_ID, ValueFrom: !Sub '${AppSecrets}:AUTH_ADMIN_GROUP_ID::'}
            - {Name: AUTH_LEADER_GROUP_ID, ValueFrom: !Sub '${AppSecrets}:AUTH_LEADER_GROUP_ID::'}
            - {Name: CRON_SECRET, ValueFrom: !Sub '${AppSecrets}:CRON_SECRET::'}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: app}}
  LoadBalancer: { Type: AWS::ElasticLoadBalancingV2::LoadBalancer, Properties: {Scheme: internet-facing, SecurityGroups: [!Ref AlbSg], Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]} }
  TargetGroup: { Type: AWS::ElasticLoadBalancingV2::TargetGroup, Properties: {VpcId: !Ref Vpc, Port: 3000, Protocol: HTTP, TargetType: ip, HealthCheckPath: /api/health, Matcher: {HttpCode: '200'}} }
  HttpsListener: { Type: AWS::ElasticLoadBalancingV2::Listener, Properties: {LoadBalancerArn: !Ref LoadBalancer, Port: 443, Protocol: HTTPS, Certificates: [{CertificateArn: !Ref CertificateArn}], DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]} }
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties: {Cluster: !Ref Cluster, TaskDefinition: !Ref TaskDefinition, DesiredCount: !Ref DesiredCount, LaunchType: FARGATE, HealthCheckGracePeriodSeconds: 120, NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref AppSg], Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]}}, LoadBalancers: [{ContainerName: app, ContainerPort: 3000, TargetGroupArn: !Ref TargetGroup}], DeploymentConfiguration: {MinimumHealthyPercent: 100, MaximumPercent: 200, DeploymentCircuitBreaker: {Enable: true, Rollback: true}}}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: events.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies: [{PolicyName: RunNotificationTask, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: 'ecs:RunTask', Resource: !Ref TaskDefinition}, {Effect: Allow, Action: 'iam:PassRole', Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]}]}}]
  NotificationSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: ProcessQueuedNotifications
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt SchedulerRole.Arn
          EcsParameters: {TaskDefinitionArn: !Ref TaskDefinition, TaskCount: 1, LaunchType: FARGATE, NetworkConfiguration: {AwsVpcConfiguration: {AssignPublicIp: ENABLED, SecurityGroups: [!Ref AppSg], Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]}}}
          Input: !Sub '{"containerOverrides":[{"name":"app","command":["sh","-c","wget -q -O - --header=\"Authorization: Bearer $CRON_SECRET\" --post-data=\"\" $APP_BASE_URL/api/notifications/run"]}]}'
Outputs:
  LoadBalancerDnsName: { Value: !GetAtt LoadBalancer.DNSName }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
