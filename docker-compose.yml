services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: portal, POSTGRES_PASSWORD: portal, POSTGRES_DB: skill_portal }
    ports: ["5432:5432"]
    volumes: [portal_db:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    env_file: [.env]
    ports: ["3000:3000"]
volumes: { portal_db: {} }
