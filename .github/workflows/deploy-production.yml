name: Deploy Azure production

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'production-*'

permissions:
  id-token: write
  contents: read

jobs:
  verify-build-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Container Apps
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          AZURE_AUTH_SECRET: ${{ secrets.AZURE_AUTH_SECRET }}
          AZURE_ENTRA_CLIENT_ID: ${{ secrets.AZURE_ENTRA_CLIENT_ID }}
          AZURE_ENTRA_CLIENT_SECRET: ${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}
          AZURE_ENTRA_ISSUER: ${{ secrets.AZURE_ENTRA_ISSUER }}
          AZURE_ADMIN_GROUP_ID: ${{ secrets.AZURE_ADMIN_GROUP_ID }}
          AZURE_LEADER_GROUP_ID: ${{ secrets.AZURE_LEADER_GROUP_ID }}
          AZURE_CRON_SECRET: ${{ secrets.AZURE_CRON_SECRET }}
          AZURE_DEPLOY_LOCATION: centralindia
          AZURE_DEPLOY_ENVIRONMENT: prod
          AZURE_RESOURCE_GROUP: rg-skillmap-prod
        run: npm run deploy:azure
